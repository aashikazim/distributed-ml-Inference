apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  annotations:
    verification: Verified on local GB10 kind; see docs/results/final-kind-gpu.json
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        fsGroup: 0
      automountServiceAccountToken: false
      nodeSelector:
        nvidia.com/gpu.present: 'true'
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: vllm
        image: vllm/vllm-openai@sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e
        args:
        - Qwen/Qwen2.5-0.5B-Instruct
        - --max-model-len
        - '2048'
        - --max-num-seqs
        - '32'
        - --gpu-memory-utilization
        - '0.25'
        - --enforce-eager
        env:
        - name: HF_HOME
          value: /models
        - name: HOME
          value: /tmp/vllm
        resources:
          requests:
            cpu: '2'
            memory: 8Gi
          limits:
            cpu: '4'
            memory: 16Gi
            nvidia.com/gpu: 1
        ports:
        - containerPort: 8000
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 5
          failureThreshold: 180
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
        volumeMounts:
        - name: models
          mountPath: /models
        - name: shm
          mountPath: /dev/shm
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: vllm-models
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
spec:
  selector:
    app: vllm
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-models
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
