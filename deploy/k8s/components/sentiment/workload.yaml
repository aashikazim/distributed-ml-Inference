apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-sentiment
  labels:
    app: worker-sentiment
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: worker-sentiment
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: worker-sentiment
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      terminationGracePeriodSeconds: 45
      containers:
      - name: worker-sentiment
        image: infer-platform:cpu
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - infer_platform.worker.main
        env:
        - name: INFER_REDIS_URL
          value: redis://redis:6379/0
        - name: INFER_API_KEYS
          valueFrom:
            secretKeyRef:
              name: platform-secrets
              key: api-keys
        - name: INFER_RATE_LIMIT_PER_S
          value: '1000'
        - name: INFER_RATE_LIMIT_BURST
          value: '2000'
        - name: INFER_WORKER_MODEL
          value: sentiment
        - name: INFER_TORCH_THREADS
          value: '1'
        - name: INFER_DEVICE
          value: cpu
        - name: INFER_MODEL_CACHE
          value: /models
        - name: HF_HUB_ETAG_TIMEOUT
          value: '10'
        - name: HF_HUB_DOWNLOAD_TIMEOUT
          value: '30'
        ports:
        - name: http
          containerPort: 9001
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: '2'
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: models
          mountPath: /app/config
          readOnly: true
        - name: weights
          mountPath: /models
        startupProbe:
          httpGet:
            path: /readyz
            port: 9001
          periodSeconds: 2
          failureThreshold: 180
        readinessProbe:
          httpGet:
            path: /readyz
            port: 9001
          periodSeconds: 2
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9001
          periodSeconds: 10
          timeoutSeconds: 2
      volumes:
      - name: models
        configMap:
          name: platform-models
      - name: weights
        persistentVolumeClaim:
          claimName: sentiment-models
      automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: worker-sentiment
spec:
  clusterIP: None
  selector:
    app: worker-sentiment
  ports:
  - port: 9001
    targetPort: 9001
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sentiment-models
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
