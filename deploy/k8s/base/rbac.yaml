apiVersion: v1
kind: ServiceAccount
metadata:
  name: autoscaler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: autoscaler
rules:
- apiGroups:
  - apps
  resources:
  - deployments/scale
  resourceNames:
  - worker-fake
  verbs:
  - get
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: autoscaler
subjects:
- kind: ServiceAccount
  name: autoscaler
roleRef:
  kind: Role
  name: autoscaler
  apiGroup: rbac.authorization.k8s.io
