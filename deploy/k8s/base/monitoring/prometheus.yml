global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
- /etc/prometheus/alerts.yml
scrape_configs:
- job_name: gateway
  dns_sd_configs:
  - names:
    - gateway-metrics
    type: A
    port: 8000
    refresh_interval: 5s
- job_name: workers
  dns_sd_configs:
  - names:
    - worker-fake
    - worker-chat
    - worker-sentiment
    type: A
    port: 9001
    refresh_interval: 5s
- job_name: exporter
  static_configs:
  - targets:
    - exporter:9002
- job_name: vllm
  dns_sd_configs:
  - names:
    - vllm
    - fake-openai
    type: A
    port: 8000
    refresh_interval: 5s
- job_name: autoscaler
  static_configs:
  - targets:
    - autoscaler:9003
