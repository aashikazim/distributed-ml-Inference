apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      terminationGracePeriodSeconds: 45
      containers:
      - name: gateway
        image: infer-platform:kind
        imagePullPolicy: IfNotPresent
        command:
        - uvicorn
        - infer_platform.gateway.app:create_app
        - --factory
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        - --no-access-log
        env:
        - name: INFER_REDIS_URL
          value: redis://redis:6379/0
        - name: INFER_API_KEYS
          valueFrom:
            secretKeyRef:
              name: platform-secrets
              key: api-keys
        - name: INFER_RATE_LIMIT_PER_S
          value: '1000'
        - name: INFER_RATE_LIMIT_BURST
          value: '2000'
        ports:
        - name: http
          containerPort: 8000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '2'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: models
          mountPath: /app/config
          readOnly: true
        startupProbe:
          httpGet:
            path: /readyz
            port: 8000
          periodSeconds: 2
          failureThreshold: 90
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8000
          periodSeconds: 2
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 2
      volumes:
      - name: models
        configMap:
          name: platform-models
      automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  selector:
    app: gateway
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    nodePort: 30080
  type: NodePort
---
