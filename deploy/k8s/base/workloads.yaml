apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoscaler
  labels:
    app: autoscaler
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: autoscaler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: autoscaler
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      terminationGracePeriodSeconds: 45
      containers:
      - name: autoscaler
        image: infer-platform:kind
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - infer_platform.autoscaler.main
        env:
        - name: INFER_REDIS_URL
          value: redis://redis:6379/0
        - name: INFER_API_KEYS
          valueFrom:
            secretKeyRef:
              name: platform-secrets
              key: api-keys
        - name: INFER_RATE_LIMIT_PER_S
          value: '1000'
        - name: INFER_RATE_LIMIT_BURST
          value: '2000'
        - name: INFER_SCALER_MODE
          value: kubernetes
        - name: INFER_AUTOSCALE_INTERVAL_S
          value: '2'
        - name: INFER_WORKER_DEPLOYMENTS
          value: '{"fake-classifier":"worker-fake"}'
        ports:
        - name: http
          containerPort: 9003
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '2'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: models
          mountPath: /app/config
          readOnly: true
        startupProbe:
          httpGet:
            path: /metrics
            port: 9003
          periodSeconds: 2
          failureThreshold: 90
        readinessProbe:
          httpGet:
            path: /metrics
            port: 9003
          periodSeconds: 2
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /metrics
            port: 9003
          periodSeconds: 10
          timeoutSeconds: 2
      volumes:
      - name: models
        configMap:
          name: platform-models
      automountServiceAccountToken: true
      serviceAccountName: autoscaler
---
apiVersion: v1
kind: Service
metadata:
  name: autoscaler
  labels:
    app: autoscaler
spec:
  selector:
    app: autoscaler
  ports:
  - name: http
    port: 9003
    targetPort: 9003
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-metrics
spec:
  clusterIP: None
  selector:
    app: gateway
  ports:
  - port: 8000
    targetPort: 8000
