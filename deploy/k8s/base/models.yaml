models:
  fake-classifier:
    backend: fake
    fake: {base_ms: 50, per_item_ms: 2, jitter_ms: 0}
    max_batch_size: 4
    prefetch_bound: 4
    max_wait_ms: 10
    request_timeout_ms: 30000
    max_queue_depth: 1000
    reclaim_idle_ms: 2000
    reclaim_interval_ms: 100
    autoscale: {min: 1, max: 4, target_backlog_per_replica: 4, target_busy_ratio: 0.7, max_head_age_s: 0.25, up_cooldown_s: 2, down_cooldown_s: 5, stabilization_s: 20}
  chat:
    backend: llm
    task: chat
    llm: {base_url: 'http://fake-openai:8000/v1', served_model: 'Qwen/Qwen2.5-0.5B-Instruct', max_concurrent: 32, max_tokens_cap: 512, coalesce_ms: 20}
    request_timeout_ms: 60000
    reclaim_idle_ms: 90000
    max_queue_depth: 100
    max_input_chars: 16000
