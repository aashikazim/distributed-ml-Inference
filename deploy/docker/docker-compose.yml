name: infer-platform
services:
  redis:
    image: redis:7.4
    command:
    - redis-server
    - --appendonly
    - 'yes'
    volumes:
    - redis-data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 2s
      timeout: 1s
      retries: 30
    restart: unless-stopped
  gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: gateway
    environment:
      INFER_REDIS_URL: redis://redis:6379/0
      INFER_API_KEYS: ${INFER_API_KEYS:?Set INFER_API_KEYS as a JSON array in your
        environment}
    ports:
    - 127.0.0.1:8000:8000
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz',
        timeout=2)
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  worker-fake:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: worker
    stop_grace_period: 15s
    command:
    - python
    - -m
    - infer_platform.worker.main
    environment:
      INFER_REDIS_URL: redis://redis:6379/0
      INFER_API_KEYS: ${INFER_API_KEYS:?Set INFER_API_KEYS as a JSON array in your
        environment}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:9001/readyz',
        timeout=2)
      interval: 2s
      timeout: 3s
      start_period: 10s
      retries: 60
  worker-sentiment:
    profiles:
    - torch
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        INSTALL_ML: '1'
      target: worker
    stop_grace_period: 15s
    command:
    - python
    - -m
    - infer_platform.worker.main
    environment:
      INFER_REDIS_URL: redis://redis:6379/0
      INFER_API_KEYS: ${INFER_API_KEYS:?Set INFER_API_KEYS as a JSON array in your
        environment}
      INFER_WORKER_MODEL: sentiment
      INFER_DEVICE: cpu
      INFER_TORCH_THREADS: '1'
      INFER_MODEL_CACHE: /models
      HF_HUB_ETAG_TIMEOUT: '10'
      HF_HUB_DOWNLOAD_TIMEOUT: '30'
    volumes:
    - model-cache:/models
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:9001/readyz',
        timeout=2)
      interval: 2s
      timeout: 3s
      start_period: 180s
      retries: 60
  fake-openai:
    profiles:
    - fake-llm
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: fake-openai
    command:
    - uvicorn
    - infer_platform.fake.openai_server:create_app
    - --factory
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    - --no-access-log
    ports:
    - 127.0.0.1:8100:8000
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health',
        timeout=2)
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  worker-chat-fake:
    profiles:
    - fake-llm
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: worker
    command:
    - python
    - -m
    - infer_platform.worker.main
    stop_grace_period: 75s
    environment:
      INFER_REDIS_URL: redis://redis:6379/0
      INFER_API_KEYS: ${INFER_API_KEYS:?Set INFER_API_KEYS as a JSON array in your
        environment}
      INFER_WORKER_MODEL: chat
      INFER_LLM_BASE_URL: http://fake-openai:8000/v1
    depends_on:
      redis:
        condition: service_healthy
      fake-openai:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:9001/readyz',
        timeout=2)
      interval: 2s
      timeout: 3s
      start_period: 10s
      retries: 60
  vllm:
    profiles:
    - gpu
    image: vllm/vllm-openai@sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e
    user: ${INFER_VLLM_UID:-1000}:0
    gpus: all
    shm_size: 2gb
    command:
    - Qwen/Qwen2.5-0.5B-Instruct
    - --max-model-len
    - '2048'
    - --max-num-seqs
    - '32'
    - --gpu-memory-utilization
    - '0.25'
    - --enforce-eager
    environment:
      HOME: /tmp/vllm
      HF_HOME: /models
      HF_HUB_ETAG_TIMEOUT: '10'
      HF_HUB_DOWNLOAD_TIMEOUT: '30'
    volumes:
    - ${INFER_VLLM_CACHE:-/tmp/infer-vllm-cache}:/models
    ports:
    - 127.0.0.1:8100:8000
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health',
        timeout=2)
      interval: 5s
      timeout: 3s
      start_period: 180s
      retries: 180
    restart: unless-stopped
  worker-chat-gpu:
    profiles:
    - gpu
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: worker
    command:
    - python
    - -m
    - infer_platform.worker.main
    stop_grace_period: 75s
    environment:
      INFER_REDIS_URL: redis://redis:6379/0
      INFER_API_KEYS: ${INFER_API_KEYS:?Set INFER_API_KEYS as a JSON array in your
        environment}
      INFER_WORKER_MODEL: chat
      INFER_LLM_BASE_URL: http://vllm:8000/v1
    depends_on:
      redis:
        condition: service_healthy
      vllm:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:9001/readyz',
        timeout=2)
      interval: 2s
      timeout: 3s
      start_period: 10s
      retries: 60
  exporter:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: exporter
    command:
    - uvicorn
    - infer_platform.exporter.main:create_app
    - --factory
    - --host
    - 0.0.0.0
    - --port
    - '9002'
    - --no-access-log
    environment:
      INFER_REDIS_URL: redis://redis:6379/0
      INFER_API_KEYS: ${INFER_API_KEYS:?Set INFER_API_KEYS as a JSON array in your
        environment}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    user: 65534:65534
    volumes:
    - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
    - 127.0.0.1:9090:9090
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.1.0
    user: 472:472
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
    - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
    - 127.0.0.1:3000:3000
    depends_on:
    - prometheus
    restart: unless-stopped
  autoscaler:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: autoscaler
    command:
    - python
    - -m
    - infer_platform.autoscaler.main
    environment:
      INFER_REDIS_URL: redis://redis:6379/0
      INFER_API_KEYS: ${INFER_API_KEYS:?Set INFER_API_KEYS as a JSON array in your
        environment}
      INFER_SCALER_MODE: dryrun
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
volumes:
  model-cache: null
  redis-data: null
