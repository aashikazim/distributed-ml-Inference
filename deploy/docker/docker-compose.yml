name: infer-platform
services:
  redis:
    image: redis:7.4
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 30
  gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    environment:
      INFER_REDIS_URL: redis://redis:6379/0
      INFER_API_KEYS: ${INFER_API_KEYS:?Set INFER_API_KEYS as a JSON array in your environment}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
  worker-fake:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    stop_grace_period: 15s
    command: ["python", "-m", "infer_platform.worker.main"]
    environment:
      INFER_REDIS_URL: redis://redis:6379/0
      INFER_API_KEYS: ${INFER_API_KEYS:?Set INFER_API_KEYS as a JSON array in your environment}
    depends_on:
      redis:
        condition: service_healthy
  worker-sentiment:
    profiles: ["torch"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        INSTALL_ML: "1"
    stop_grace_period: 15s
    command: ["python", "-m", "infer_platform.worker.main"]
    environment:
      INFER_REDIS_URL: redis://redis:6379/0
      INFER_API_KEYS: ${INFER_API_KEYS:?Set INFER_API_KEYS as a JSON array in your environment}
      INFER_WORKER_MODEL: sentiment
      INFER_DEVICE: cpu
      INFER_TORCH_THREADS: "1"
      INFER_MODEL_CACHE: /models
      HF_HUB_ETAG_TIMEOUT: "10"
      HF_HUB_DOWNLOAD_TIMEOUT: "30"
    volumes:
      - model-cache:/models
    depends_on:
      redis:
        condition: service_healthy
  fake-openai:
    profiles: ["fake-llm"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    command: ["uvicorn", "infer_platform.fake.openai_server:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports:
      - "127.0.0.1:8100:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
  worker-chat-fake:
    profiles: ["fake-llm"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    command: ["python", "-m", "infer_platform.worker.main"]
    stop_grace_period: 75s
    environment:
      INFER_REDIS_URL: redis://redis:6379/0
      INFER_API_KEYS: ${INFER_API_KEYS:?Set INFER_API_KEYS as a JSON array in your environment}
      INFER_WORKER_MODEL: chat
      INFER_LLM_BASE_URL: http://fake-openai:8000/v1
    depends_on:
      redis:
        condition: service_healthy
      fake-openai:
        condition: service_healthy
  vllm:
    profiles: ["gpu"]
    # Observed package vLLM 0.33.0; immutable official multi-architecture image.
    image: vllm/vllm-openai@sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e
    user: "${INFER_VLLM_UID:-1000}:0"
    gpus: all
    shm_size: 2gb
    command: ["Qwen/Qwen2.5-0.5B-Instruct", "--max-model-len", "2048", "--max-num-seqs", "32", "--gpu-memory-utilization", "0.25", "--enforce-eager"]
    environment:
      HOME: /tmp/vllm
      HF_HOME: /models
      HF_HUB_ETAG_TIMEOUT: "10"
      HF_HUB_DOWNLOAD_TIMEOUT: "30"
    volumes:
      - ${INFER_VLLM_CACHE:-/tmp/infer-vllm-cache}:/models
    ports:
      - "127.0.0.1:8100:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      start_period: 180s
      retries: 180
  worker-chat-gpu:
    profiles: ["gpu"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    command: ["python", "-m", "infer_platform.worker.main"]
    stop_grace_period: 75s
    environment:
      INFER_REDIS_URL: redis://redis:6379/0
      INFER_API_KEYS: ${INFER_API_KEYS:?Set INFER_API_KEYS as a JSON array in your environment}
      INFER_WORKER_MODEL: chat
      INFER_LLM_BASE_URL: http://vllm:8000/v1
    depends_on:
      redis:
        condition: service_healthy
      vllm:
        condition: service_healthy

volumes:
  model-cache:
  redis-data:
