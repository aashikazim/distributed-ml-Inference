global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ['gateway:8000']
  - job_name: workers
    dns_sd_configs:
      - names: [worker-fake, worker-sentiment, worker-chat-fake, worker-chat-gpu]
        type: A
        port: 9001
        refresh_interval: 5s
  - job_name: exporter
    static_configs:
      - targets: ['exporter:9002']
  - job_name: vllm
    dns_sd_configs:
      - names: [vllm, fake-openai]
        type: A
        port: 8000
        refresh_interval: 5s
