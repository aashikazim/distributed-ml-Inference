groups:
  - name: inference
    rules:
      - alert: InferenceLatencyAboveMeasuredSLO
        expr: histogram_quantile(0.95, sum by (le, model) (rate(gateway_request_duration_seconds_bucket{endpoint="/v1/infer/{model}"}[5m]))) > on(model) platform_latency_slo_seconds
        for: 5m
        labels: {severity: warning}
        annotations: {summary: 'p95 exceeds the measured SLO; inspect queue and compute panels'}
      - alert: BacklogGrowing
        expr: deriv(queue_backlog[5m]) > 0
        for: 5m
        labels: {severity: warning}
        annotations: {summary: 'Backlog has grown for five minutes'}
      - alert: NoWorkersAlive
        expr: workers_alive == 0
        for: 30s
        labels: {severity: critical}
        annotations: {summary: 'Configured model has no accepting workers'}
      - alert: DeadLetterQueueNonEmpty
        expr: queue_dlq_entries > 0
        for: 10s
        labels: {severity: warning}
        annotations: {summary: 'Poison request evidence requires investigation'}
      - alert: ExporterStale
        expr: time() - exporter_last_success_timestamp_seconds > 15
        for: 15s
        labels: {severity: critical}
        annotations: {summary: 'Redis observations are stale, do not trust frozen gauges'}
