[project]
name = "infer-platform"
version = "0.1.0"
description = "A learning-oriented Redis Streams inference platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi", "uvicorn[standard]", "pydantic>=2", "pydantic-settings",
  "redis[hiredis]>=5", "structlog", "pyyaml", "prometheus-client",
]
[dependency-groups]
dev = ["pytest", "pytest-asyncio", "testcontainers[redis]", "httpx", "ruff", "mypy", "types-PyYAML"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/infer_platform"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
check_untyped_defs = true
[[tool.mypy.overrides]]
module = ["infer_platform.common.*", "infer_platform.autoscaler.*"]
strict = true
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m 'not gpu'"
markers = ["integration: real Redis", "chaos: process failure", "slow: lengthy test", "gpu: requires GPU"]

[tool.ruff.lint.per-file-ignores]
"tests/integration/*" = ["ASYNC109", "ASYNC110"]

"scripts/experiment_e1.py" = ["ASYNC110"]
