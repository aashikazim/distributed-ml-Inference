models:
  sentiment:
    autoscale: {min: 1, max: 8, target_backlog_per_replica: 10, target_busy_ratio: 0.7}
    backend: torch
    task: classification
    hf_id: distilbert-base-uncased-finetuned-sst-2-english
    max_batch_size: 16
    max_wait_ms: 10
    max_input_chars: 4000
    request_timeout_ms: 5000
    max_queue_depth: 200
  fake-classifier:
    autoscale: {min: 1, max: 10, target_backlog_per_replica: 20, target_busy_ratio: 0.7}
    backend: fake
    fake: {base_ms: 20, per_item_ms: 2, jitter_ms: 3}
    max_batch_size: 32
    max_wait_ms: 10
    max_input_chars: 4000
    request_timeout_ms: 5000
    max_queue_depth: 500

  chat:
    autoscale: {min: 1, max: 4, target_backlog_per_replica: 8, target_busy_ratio: 0.8}
    backend: llm
    task: chat
    llm:
      base_url: http://vllm:8000/v1
      served_model: Qwen/Qwen2.5-0.5B-Instruct
      max_concurrent: 32
      max_tokens_cap: 512
      coalesce_ms: 20
    max_input_chars: 16000
    request_timeout_ms: 60000
    max_queue_depth: 100
    reclaim_idle_ms: 90000
