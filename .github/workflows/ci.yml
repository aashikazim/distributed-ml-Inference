name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: --health-cmd 'redis-cli ping' --health-interval 2s --health-timeout 1s --health-retries 30
    env:
      INFER_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: {version: '0.13.6', python-version: '3.12'}
      - run: uv sync --frozen --extra ml
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest
  images:
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - {target: gateway, tag: gateway, ml: "0"}
          - {target: worker, tag: worker-fake, ml: "0"}
          - {target: worker, tag: worker-cpu, ml: "1"}
          - {target: autoscaler, tag: autoscaler, ml: "0"}
          - {target: exporter, tag: exporter, ml: "0"}
          - {target: fake-openai, tag: fake-openai, ml: "0"}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ matrix.target }}
          build-args: INSTALL_ML=${{ matrix.ml }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.image.outputs.name }}:${{ matrix.tag }}-${{ github.sha }}
